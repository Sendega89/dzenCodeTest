services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: inventory
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pinventory"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  web:
    build: .
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      JWT_SECRET: inventory-demo-secret
      GATEWAY_URL: http://gateway:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      gateway:
        condition: service_healthy

  products-mfe:
    build: .
    command: npm run start -w @inventory/products -- --port 3001
    ports:
      - "3001:3001"
    environment:
      GATEWAY_URL: http://gateway:4000
      JWT_SECRET: inventory-demo-secret
    depends_on:
      gateway:
        condition: service_healthy

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      products-mfe:
        condition: service_started

  gateway:
    build: .
    command: npm run start -w @inventory/gateway
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      JWT_SECRET: inventory-demo-secret
      ORDERS_URL: http://orders:4101
      PRODUCTS_URL: http://products:4102
      AUTH_URL: http://auth:4103
      PORT: 4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      mysql:
        condition: service_healthy
      orders:
        condition: service_started
      products:
        condition: service_started
      auth:
        condition: service_started

  orders:
    build: .
    command: npm run start -w @inventory/orders-service
    ports:
      - "4101:4101"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4101
    depends_on:
      mysql:
        condition: service_healthy

  products:
    build: .
    command: npm run start -w @inventory/products-service
    ports:
      - "4102:4102"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4102
    depends_on:
      mysql:
        condition: service_healthy

  auth:
    build: .
    command: npm run start -w @inventory/auth-service
    ports:
      - "4103:4103"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      JWT_SECRET: inventory-demo-secret
      PORT: 4103
    depends_on:
      mysql:
        condition: service_healthy

  realtime:
    build: .
    command: npm run start -w @inventory/realtime
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4001
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    command: npm run start -w @inventory/worker
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
