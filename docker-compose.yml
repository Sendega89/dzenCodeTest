services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: inventory
      MYSQL_ROOT_PASSWORD: inventory
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pinventory"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      JWT_SECRET: inventory-demo-secret
      NEXT_PUBLIC_REALTIME_URL: http://localhost:4001
    depends_on:
      mysql:
        condition: service_healthy

  products-mfe:
    build: .
    command: npm run start -w @inventory/products -- --port 3001
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_SHELL_URL: http://localhost:3000

  gateway:
    build: .
    command: npm run start -w @inventory/gateway
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4000
    depends_on:
      mysql:
        condition: service_healthy

  orders:
    build: .
    command: npm run start -w @inventory/orders-service
    ports:
      - "4101:4101"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4101
    depends_on:
      mysql:
        condition: service_healthy

  products:
    build: .
    command: npm run start -w @inventory/products-service
    ports:
      - "4102:4102"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4102
    depends_on:
      mysql:
        condition: service_healthy

  auth:
    build: .
    command: npm run start -w @inventory/auth-service
    ports:
      - "4103:4103"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      JWT_SECRET: inventory-demo-secret
      PORT: 4103
    depends_on:
      mysql:
        condition: service_healthy

  realtime:
    build: .
    command: npm run start -w @inventory/realtime
    ports:
      - "4001:4001"
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
      PORT: 4001
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    command: npm run start -w @inventory/worker
    environment:
      DATABASE_URL: mysql://inventory:inventory@mysql:3306/inventory
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
